name: Deploy Batata Cósmica 🥔 to GitHub Pages

# Publica o site estático no GitHub Pages.
# Pré-requisito (uma vez): Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches:
      - claude/intelligent-archimedes-2en9m7
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
